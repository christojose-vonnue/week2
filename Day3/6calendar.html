<!DOCTYPE html>
<html lang="en">
<head>

    <title>Calendar</title>
    <link href="6calendar.css" rel="stylesheet" type="text/css">
</head>
<body>
    <div class="master-div">

 <div class="day-type-day-grid">

</div>

</html>
