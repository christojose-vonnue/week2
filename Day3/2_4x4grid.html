<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4x4</title>
    <link href="2css.css" rel="stylesheet" type="text/css">
</head>
<body>
    <h1>Expicit Grid</h1>

    <div class="explicitdiv">
        <div class="itm" id="one">1</div>
        <div class="itm" id="two">2</div>
        <div class="itm">3</div>
        <div class="itm" id="four">4</div>
        <div class="itm" id="five">5</div>
        <div class="itm" id="six">6</div>
        <div class="itm" id="seven">7</div>
        <div class="itm" id="last">8</div>
    </div>

    <h1>Dense vs Sparse</h1>
    <h2>Shorten the viewport to see dense matix</h2>
    <div class="explicitdiv" id="sparse">
        <div class="itm" id="a">1</div>
        <div class="itm" id="b">2</div>
        <div class="itm">3</div>
        <div class="itm" id="d">4</div>
        <div class="itm">5</div>
        <div class="itm">6</div>
        <div class="itm">7</div>
        <div class="itm">8</div>
    </div>


</body>
</html>
